<section class="main-section">

    <img
        class="hero-bg"
        src="assets/images/banner-home.png"
        alt="Paneles solares - Lebsolar Ingeniería"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <div class="hero-subtitle">
            <span class="line"></span>
            <span>ENERGÍA SOLAR INTELIGENTE</span>
        </div>

        <h1>
            Soluciones de
            <span>energía solar</span>
            para un futuro
            sostenible.
        </h1>

        <p>
            Diseñamos, instalamos y legalizamos sistemas fotovoltaicos para
            proyectos residenciales, comerciales e industriales en todo el país.
        </p>

        <div class="hero-buttons">

            <a routerLink="/contacto" class="btn-primary">
                COTIZA TU PROYECTO
            </a>

            <a routerLink="/proyectos" class="btn-secondary">
                VER PROYECTOS
            </a>

        </div>

    </div>

</section>





<section class="projects-section">

    <div class="projects-header">

        <h2>NUESTROS PROYECTOS</h2>

    </div>


    <div
        class="projects-carousel"
        #projectsCarousel
    >

        <button
            type="button"
            class="carousel-btn carousel-prev"
            (click)="moverProyecto(-1)"
            aria-label="Proyecto anterior"
        >
            &#10094;
        </button>


        <div
            class="projects-window"
            #projectsWindow
        >

            <div class="projects-track">

                <article
                    class="project-card"
                    *ngFor="let proyecto of proyectos"
                >

                    <img
                        [src]="proyecto.imagen"
                        [alt]="proyecto.alt"
                    >

                </article>

            </div>

        </div>


        <button
            type="button"
            class="carousel-btn carousel-next"
            (click)="moverProyecto(1)"
            aria-label="Siguiente proyecto"
        >
            &#10095;
        </button>

    </div>

</section>
